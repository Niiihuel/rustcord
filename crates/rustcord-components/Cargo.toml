[package]
name = "rustcord-components"
description = "Rustcord's interface pieces, built with limn"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# Interface text in the language the person chose.
rustcord-i18n.workspace = true
limn.workspace = true
rustcord-model.workspace = true
# Local dates for the timeline: "Hoy a las 14:05".
chrono.workspace = true
# A Twemoji picture as a limn `RasterImage`, drawn whole in a message of
# emoji alone: its digest, which limn-egui checks, and its bytes encoded.
# The versions rustcord-core already builds.
sha2 = "0.10"
base64 = "0.22"
# A theme of one's own is kept and shared as a small JSON file of data,
# read strictly: the versions the workspace already builds.
serde.workspace = true
serde_json.workspace = true
