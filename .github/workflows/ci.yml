# Formatting, lints, tests and cargo deny on every push to main and every
# pull request, on Linux and Windows; macOS is not covered.
# Releases: release.yml.
name: CI

# A branch is checked through its pull request; pushing to it as well would
# run everything twice, in two groups that never cancel each other.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# Actions are pinned by commit, with their release named beside it.
jobs:
  linux:
    name: fmt, clippy y tests (Linux)
    # WebKitGTK 6 for the login window, as release.yml's Linux build.
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      # The isolated FileChooser fixtures start their own bus, never the session's.
      RUSTCORD_TEST_DBUS_DAEMON: /usr/bin/dbus-daemon
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # The distribution's libraries, as release.yml's Linux build: the C
      # toolchain, nasm and cmake (OpenH264, libopus), the window, audio and
      # GStreamer libraries, GTK 4 and WebKitGTK for the login window; and
      # for the tests, GStreamer's plugins (the video decoders) and dbus.
      - name: dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake nasm clang libclang-dev pkg-config dbus \
            libasound2-dev libpipewire-0.3-dev libspa-0.2-dev \
            libwayland-dev libxkbcommon-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad \
            libgtk-4-dev libwebkitgtk-6.0-dev
      # The workspace's rust-version: raise both together, so a newer
      # Clippy's lints never fail a push on their own.
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: cargo fmt
        run: cargo fmt --all -- --check
      # Every feature, so the unofficial session's login and hCaptcha WebView
      # is linted too. `--locked` builds the Cargo.lock cargo deny checked,
      # never a newer resolution.
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      # Tests marked #[ignore] need a GPU, a display, the system's fonts or a
      # release build to measure; they are not run here.
      - name: cargo test
        run: cargo test --workspace --locked

  # Windows: the MSVC target releases are built with. The
  # runner's own Visual Studio and CMake build the C that crates bundle
  # (SQLite, libopus). Every feature, so the Linux-only login window is seen
  # to stay out of the Windows build.
  windows:
    name: clippy y tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      # The sources and fixtures as they are in the repository: Git for
      # Windows would turn their line ends into CRLF.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: cargo test
        run: cargo test --workspace --locked
      # The system's own services on the runner's throwaway account, which
      # the default run leaves alone on a person's computer: Credential
      # Manager, the Run key and a named pipe of the session.
      - name: cargo test (servicios de Windows)
        run: cargo test -p rustcord-platform --locked -- --ignored
      # Local HTML only: executing scripts in the hidden engine probe does
      # not prove that the login controller can display a page.
      # Hosted images do not guarantee the Runtime is present. Microsoft's
      # documented Evergreen registry check/bootstrapper, only on the runner.
      - name: WebView2 Runtime para las pruebas
        shell: pwsh
        run: |
          $runtimeId = '{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $keys = @(
            "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\$runtimeId",
            "HKCU:\Software\Microsoft\EdgeUpdate\Clients\$runtimeId"
          )
          $installed = $keys | ForEach-Object {
            (Get-ItemProperty -LiteralPath $_ -Name pv -ErrorAction SilentlyContinue).pv
          } | Where-Object { $_ -and [version]$_ -gt [version]'0.0.0.0' }
          if (-not $installed) {
            $setup = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebview2Setup.exe'
            Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $setup
            $process = Start-Process -FilePath $setup -ArgumentList '/silent', '/install' -WindowStyle Hidden -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "WebView2 setup failed: $($process.ExitCode)" }
          }
      - name: cargo test (WebView2 de Windows)
        run: cargo test -p rustcord-login --features webview --locked -- windows::tests::native_ --ignored --test-threads=1

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Licenses, security advisories, crate sources and bans (deny.toml).
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
